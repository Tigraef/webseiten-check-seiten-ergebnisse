input:focus-visible, button:focus-visible { outline: 3px solid #3f7f70; outline-offset: 2px; }
button { margin-top: 14px; width: 100%; min-height: 48px; font: 600 17px system-ui, sans-serif; color: #fff; background: #3f7f70; border: 0; border-radius: 999px; cursor: pointer; }

function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
async function oeffnen(pw, anker) {
  var roh = b64(DATEN), salz = roh.slice(0, 16), iv = roh.slice(16, 28), inhalt = roh.slice(28);
  var basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  var schluessel = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: salz, iterations: 250000, hash: "SHA-256" }, basis, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  var klar = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, schluessel, inhalt);
  try { sessionStorage.setItem("tim-pw", pw); } catch (e) {}
  history.replaceState(null, "", location.pathname + location.search + (anker ? "#" + anker : ""));
  document.open(); document.write(new TextDecoder().decode(klar)); document.close();
  if (anker) setTimeout(function () { var z = document.getElementById(anker); if (z) z.scrollIntoView(); }, 50);
}
document.getElementById("f").addEventListener("submit", function (e) {
  e.preventDefault();
  var fehler = document.getElementById("fehler");
  fehler.textContent = "";
  oeffnen(document.getElementById("pw").value.trim(), "").catch(function () { fehler.textContent = "Das Passwort stimmt nicht. Bitte Groß- und Kleinschreibung prüfen."; });
});
(function () {
  var h = location.hash ? decodeURIComponent(location.hash.slice(1)) : "", gespeichert = "";
  try { gespeichert = sessionStorage.getItem("tim-pw") || ""; } catch (e) {}
  if (h) oeffnen(h, "").catch(function () { if (gespeichert) oeffnen(gespeichert, h).catch(function () {}); });
  else if (gespeichert) oeffnen(gespeichert, "").catch(function () {});
