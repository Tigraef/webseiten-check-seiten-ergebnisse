async function oeffnen(pw) {
  var roh = b64(DATEN), salz = roh.slice(0, 16), iv = roh.slice(16, 28), inhalt = roh.slice(28);
  var basis = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  var schluessel = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: salz, iterations: 250000, hash: "SHA-256" }, basis, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  var klar = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, schluessel, inhalt);

  document.open(); document.write(new TextDecoder().decode(klar)); document.close();
